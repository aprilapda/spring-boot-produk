spring.application.name=pelanggan
spring.datasource.url=jdbc:h2:mem:pelanggandb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT (harus SAMA dengan Auth Service)
app.jwt.signing-key=${JWT_SIGNING_KEY:RahasiaBangetIniHarusPanjangMinimal32HurufUntukHS256-1234567890}
app.jwt.expiration-ms=86400000
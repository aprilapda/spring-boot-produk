spring.application.name=ORDER-QUERY
server.port=${ORDER_QUERY_PORT:8087}

# ABL_DATA_DIR must be set to a verified absolute directory outside the repository
# before starting the service. This path is intentionally not defaulted.
spring.datasource.url=jdbc:h2:file:${ABL_DATA_DIR}/order-query/query;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${ORDER_QUERY_DB_USERNAME:sa}
spring.datasource.password=${ORDER_QUERY_DB_PASSWORD:}

# V1 is an idempotent additive schema bootstrap. Persistent Hibernate DDL remains validation-only.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-v1.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# RabbitMQ CQRS subscription (antrean proyeksi terdeklarasikan oleh config).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Retry transien 3 percobaan lalu DLQ; bukan requeue tanpa batas.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-returns=true

# JWT verification must use the same signing key as AUTH and ORDER.
app.jwt.signing-key=${JWT_SIGNING_KEY:RahasiaBangetIniHarusPanjangMinimal32HurufUntukHS256-1234567890}

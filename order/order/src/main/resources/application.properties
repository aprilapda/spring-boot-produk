spring.application.name=order
# Command store H2 file-backed (per rancangan CQRS t2.1): persisten, tidak
# create-drop. Path di luar repo via ABL_DATA_DIR; default di folder user.
spring.datasource.url=jdbc:h2:file:${ABL_DATA_DIR:${user.home}/.abl-data}/order-write/order;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT (harus SAMA dengan Auth Service)
app.jwt.signing-key=${JWT_SIGNING_KEY:RahasiaBangetIniHarusPanjangMinimal32HurufUntukHS256-1234567890}
app.jwt.expiration-ms=86400000

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Konfigurasi khusus pengujian: DB in-memory (TIDAK menyentuh command store
# file-backed milik pengguna), Eureka mati agar tidak meregistrasi saat test,
# port acak agar tidak bentrok dengan instance service yang berjalan.
spring.datasource.url=jdbc:h2:mem:order-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

server.port=0

# JWT harus SAMA dengan Auth Service (salinan dari konfigurasi main).
app.jwt.signing-key=RahasiaBangetIniHarusPanjangMinimal32HurufUntukHS256-1234567890
app.jwt.expiration-ms=86400000

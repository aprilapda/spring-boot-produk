spring.application.name=auth
server.port=8086
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:h2:file:${ABL_DATA_DIR:${user.home}/.abl-data}/auth/authdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-v1.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.signing-key=${JWT_SIGNING_KEY:RahasiaBangetIniHarusPanjangMinimal32HurufUntukHS256-1234567890}
app.jwt.expiration-ms=86400000
